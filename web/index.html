<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Digital movie clapperboard.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Clapperboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Clapperboard</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Keep the board at its normal size: no pinch-zoom or double-tap zoom.
    iPadOS and iOS browsers ignore "user-scalable=no", so the zoom gestures
    are cancelled here instead. The app itself uses no multi-finger or
    zoom gestures, so nothing else is affected.
  -->
  <style>
    html, body { touch-action: none; overscroll-behavior: none; }
  </style>
  <script>
    (function () {
      var stop = function (e) { e.preventDefault(); };
      var opts = { passive: false };
      // Safari/WebKit pinch (iPad and iPhone, including Chrome there).
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
        document.addEventListener(t, stop, opts);
      });
      // Two or more fingers moving: pinch on other browsers.
      document.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1) e.preventDefault();
      }, opts);
      // Trackpad pinch and Ctrl + mouse wheel on computers.
      document.addEventListener('wheel', function (e) {
        if (e.ctrlKey) e.preventDefault();
      }, opts);
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
